services:
  postgres:
    image: postgres:16-alpine
    container_name: aethernet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aethernet
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether -d aethernet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
