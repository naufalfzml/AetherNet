procs:
  backend:
    cwd: backend
    shell: go run ./cmd/server
  compute-sidecar:
    shell: pnpm --filter @aethernet/compute-sidecar dev
  storage-sidecar:
    shell: pnpm --filter @aethernet/storage-sidecar dev
  frontend:
    shell: pnpm --filter @aethernet/frontend dev
  indexer:
    cwd: backend
    shell: go run ./cmd/indexer
  autopilot:
    cwd: backend
    shell: go run ./cmd/worker
