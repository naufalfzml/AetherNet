name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Run forge tests
        run: |
          if [ -f contracts/foundry.toml ]; then
            cd contracts
            forge test
          else
            echo "contracts/foundry.toml not present yet; skipping"
          fi

  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run Go tests
        run: |
          cd backend
          if find . -name '*.go' -print -quit | grep -q .; then
            go test ./...
          else
            echo "backend Go packages not present yet; skipping"
          fi

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: |
          if [ -f frontend/package.json ]; then
            pnpm --filter @aethernet/frontend build
          else
            echo "frontend/package.json not present yet; skipping"
          fi

  compute-sidecar:
    name: compute-sidecar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and test sidecar
        run: |
          if [ -f services/compute-sidecar/package.json ]; then
            pnpm --filter @aethernet/compute-sidecar typecheck
            pnpm --filter @aethernet/compute-sidecar test
          else
            echo "services/compute-sidecar/package.json not present yet; skipping"
          fi
